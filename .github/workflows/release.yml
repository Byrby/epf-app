name: Release

on:
  push:
    tags: ['v*']                     # se déclenche sur un tag v1.0.0, v1.1.0…

permissions:
  contents: write                    # pour créer la release GitHub
  packages: write                    # pour pousser l'image sur GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}      # le nom du tag, ex. v1.0.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Construire l'image
        run: docker build -t app --build-arg APP_VERSION="$VERSION" .

      - name: Test de démarrage en mode production
        run: |
          docker run -d -p 3000:3000 -e APP_ENV=production app
          sleep 5
          curl --fail http://localhost:3000/health

      - name: Publier l'image sur GHCR
        run: |
          # GHCR exige un nom en minuscules : Mon-Login/Mon-Depot → mon-login/mon-depot
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag app "$IMAGE:$VERSION"
          docker tag app "$IMAGE:stable"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:stable"

      - name: Créer la release GitHub
        run: gh release create "$VERSION" --generate-notes
