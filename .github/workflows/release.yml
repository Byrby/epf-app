name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # créer la GitHub Release
      packages: write     # pousser l'image
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable

      - name: Construire l'image candidate (sans la pousser)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: candidate:local
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}

      - name: Smoke test en conditions de production
        run: |
          docker run -d --name app -p 3000:3000 -e APP_ENV=production candidate:local
          for i in $(seq 1 10); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 2
          done
          echo "L'application ne démarre pas :"; docker logs app; exit 1

      - name: Publier (seulement si le smoke test est vert)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
