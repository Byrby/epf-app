# Ne fusionner sur main que le temps de la démonstration, avec un secret DEMO_SECRET bidon,
# puis remplacer par la version corrigée (en bas de fichier) ou supprimer.
name: Accueil

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  accueil:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
    steps:
      - run: |
          echo "Nouvelle issue : ${{ github.event.issue.title }}"

